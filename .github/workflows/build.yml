name: Build Lapas 1.20.4
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CraftCanvasMC/Canvas
          ref: 2f58680f4c25c32344847cb10388d2d12ee69269
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-lapas-${{ github.run_id }}
          restore-keys: |
            gradle-lapas-
            gradle-canvas-

      - name: Git config
        run: |
          git config --global user.email "a@a.com"
          git config --global user.name "builder"

      # ===== ĐỔI TÊN Canvas -> Lapas (giữ nguyên URL upstream) =====
      - name: Rename Canvas -> Lapas
        run: |
          git ls-files -z | grep -zv -E '^\.github/|\.(png|jar|zip|gif|ico)$' | xargs -0 -r sed -i \
            -e 's#CraftCanvasMC/Canvas#@@CCREPO@@#g' \
            -e 's#CraftCanvasMC#@@CCMC@@#g' \
            -e 's#canvas\.kesug\.com#@@CCSITE@@#g' \
            -e 's/canvas/lapas/g' \
            -e 's/Canvas/Lapas/g' \
            -e 's/CANVAS/LAPAS/g' \
            -e 's#@@CCREPO@@#CraftCanvasMC/Canvas#g' \
            -e 's#@@CCMC@@#CraftCanvasMC#g' \
            -e 's#@@CCSITE@@#canvas.kesug.com#g'
          git ls-files | grep -i canvas | grep -v '^\.github/' | while read -r f; do
            n="$(echo "$f" | sed -e 's/canvas/lapas/g' -e 's/Canvas/Lapas/g' -e 's/CANVAS/LAPAS/g')"
            [ "$f" != "$n" ] && mkdir -p "$(dirname "$n")" && git mv "$f" "$n"
          done
          find . -depth -type d -empty -not -path "./.git/*" -delete
          git add -A
          git commit -qm "Rename Canvas to Lapas"
          echo "Còn sót:"; git grep -I -n -i canvas -- . ':!.github' | grep -v -E 'CraftCanvasMC|canvas\.kesug\.com' || echo "  (không còn)"

      - name: Add Forge Maven via Gradle init script
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/forge.gradle <<'INIT'
          allprojects {
            repositories {
              maven { url = uri("https://maven.minecraftforge.net/") }
            }
          }
          INIT

      - name: Fix dead jcenter repo
        run: sed -i 's|jcenter()|mavenCentral()|g' build.gradle.kts

      - name: Apply patches (retry 5 lan)
        run: |
          for i in 1 2 3 4 5; do
            echo "=== Lan thu $i ==="
            ./gradlew applyPatches --no-daemon && exit 0
            echo "Loi, cho 60s roi thu lai..."
            sleep 60
          done
          exit 1

      - name: Build server jar
        run: ./gradlew createLapasServer -x test --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lapas-1.20.4
          path: target/*.jar
          if-no-files-found: error
