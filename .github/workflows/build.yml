name: Build Canvas 1.20.4
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CraftCanvasMC/Canvas
          ref: 2f58680f4c25c32344847cb10388d2d12ee69269
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle (giu lai file da tai, tranh tai lai khi loi)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-canvas-${{ github.run_id }}
          restore-keys: |
            gradle-canvas-

      - name: Git config
        run: |
          git config --global user.email "a@a.com"
          git config --global user.name "builder"

      # Sua jcenter TRUOC khi chay Gradle
      - name: Fix dead jcenter repo
        run: |
          sed -i 's|jcenter()|mavenCentral()|g' build.gradle.kts
          grep -n "jcenter\|mavenCentral" build.gradle.kts || true

      - name: Apply patches (retry 5 lan)
        run: |
          for i in 1 2 3 4 5; do
            echo "=== Lan thu $i ==="
            ./gradlew applyPatches --no-daemon && exit 0
            echo "Loi, cho 60s roi thu lai..."
            sleep 60
          done
          echo "applyPatches that bai sau 5 lan"
          exit 1

      - name: Build server jar (retry 3 lan)
        run: |
          for i in 1 2 3; do
            echo "=== Lan thu $i ==="
            ./gradlew createCanvasServer -x test --no-daemon && exit 0
            echo "Loi, cho 60s roi thu lai..."
            sleep 60
          done
          echo "createCanvasServer that bai sau 3 lan"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: canvas-1.20.4
          path: target/*.jar
          if-no-files-found: error
