name: Build Lapas 1.20.4

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Normalize Gradle wrapper
        run: |
          set -euo pipefail
          echo "pwd=$(pwd)"
          ls -la
          if [ ! -f ./gradlew ]; then
            echo "gradlew missing"
            find . -name gradlew -maxdepth 4 -print
            exit 1
          fi
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew --version --no-daemon

      - name: Diagnose Gradle tasks
        run: |
          set +e
          ./gradlew tasks --all --no-daemon > tasks.txt
          echo "===== root project name ====="
          grep -n "rootProject.name" settings.gradle.kts || true
          echo "===== createLapas / withId / project.name ====="
          grep -nR --include='*.kts' -E 'createLapas|withId|project\.name' . || true
          echo "===== tasks matching lapas / bundler / paperclip ====="
          grep -Ei 'lapas|bundler|paperclip' tasks.txt || echo "(no matching task)"
          echo "===== tail of tasks ====="
          tail -n 40 tasks.txt

      - name: Build Lapas server
        run: ./gradlew createLapasServer -x test --no-daemon
